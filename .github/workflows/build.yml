name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: APKs bauen
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :probe:assembleDebug --stacktrace

      - name: APKs umbenennen
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk x15u-kamera.apk
          cp probe/build/outputs/apk/debug/probe-debug.apk kamera-diagnose.apk

      - name: APKs als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            x15u-kamera.apk
            kamera-diagnose.apk

      - name: Release "latest" aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest x15u-kamera.apk kamera-diagnose.apk \
            --target "$GITHUB_SHA" \
            --title "Aktueller Build" \
            --notes "Automatisch gebaut aus Commit $GITHUB_SHA. x15u-kamera.apk ist die Kamera-App, kamera-diagnose.apk das Diagnosewerkzeug."
